<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <!-- Canevas fixe 1920 px : la WebView (useWideViewPort + loadWithOverviewMode) l'ajuste à l'écran. -->
  <meta name="viewport" content="width=1920, initial-scale=1, user-scalable=no">
  <title>X96Q Launcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Teinte d'ambiance tirée de l'icône sélectionnée (opacité uniquement, aucun flou). -->
  <div class="ambient" aria-hidden="true">
    <div class="ambient-layer" id="ambientA"></div>
    <div class="ambient-layer" id="ambientB"></div>
  </div>

  <div class="stage">
    <header class="topbar">
      <p class="date" id="date"></p>
      <div class="topbar-right">
        <div class="pill" id="settingsButton" data-zone="top" role="button" aria-label="Paramètres Android">
          <svg class="pill-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" fill="none" stroke="currentColor" stroke-width="1.75"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
          </svg>
          <span>Paramètres</span>
        </div>
        <time class="clock" id="clock">--:--</time>
      </div>
    </header>

    <section class="hero" id="hero" aria-live="polite">
      <div class="hero-tile" id="heroTile"><img id="heroIcon" alt="" width="96" height="96"></div>
      <div class="hero-text" id="heroText">
        <p class="hero-kicker" id="heroKicker">Accueil</p>
        <h1 class="hero-title" id="heroTitle">Chargement</h1>
        <p class="hero-meta" id="heroMeta">Lecture des applications installées…</p>
        <ul class="hero-hints" id="heroHints">
          <li><kbd>OK</kbd><span id="hintPrimary">Ouvrir</span></li>
          <li><kbd>OK</kbd><span class="hint-hold">maintenu</span><span id="hintPin">Épingler</span></li>
        </ul>
      </div>
    </section>

    <main class="rows" id="rows">
      <section class="row" id="rowFavorites" data-row="favorites">
        <h2 class="row-title">Favoris <span class="row-count" id="countFavorites"></span></h2>
        <div class="track" id="trackFavorites"></div>
        <p class="row-empty" id="emptyFavorites">Maintenez <kbd>OK</kbd> sur une application pour l’épingler ici.</p>
      </section>

      <section class="row" id="rowAll" data-row="all">
        <h2 class="row-title">Toutes les applications <span class="row-count" id="countAll"></span></h2>
        <div class="track" id="trackAll"></div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
