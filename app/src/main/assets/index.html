<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <!-- Le canevas 1920×1080 est ajusté à l'écran réel par app.js (fitStage). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>X96Q Launcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Scène atmosphérique : deux calques de halo en fondu croisé + voile fixe vers le noir. -->
  <div class="atmosphere" aria-hidden="true">
    <div class="halo" id="haloA"></div>
    <div class="halo" id="haloB"></div>
    <div class="veil"></div>
  </div>

  <header class="topbar">
    <p class="crumb"><span class="crumb-home">Accueil</span><span class="crumb-dot"></span><span class="crumb-date" id="date"></span></p>
    <div class="status">
      <div class="weather is-hidden" id="weather">
        <span class="weather-icon" id="weatherIcon"></span>
        <span class="weather-temp" id="weatherTemp"></span>
      </div>
      <span class="status-sep" id="weatherSep"></span>
      <time class="clock" id="clock">--:--</time>
      <div class="settings" id="settings" role="button" aria-label="Paramètres">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>
  </header>

  <section class="hero" id="hero">
    <div class="hero-copy" id="heroCopy">
      <span class="hero-badge" id="heroBadge">Accueil</span>
      <h1 class="hero-title" id="heroTitle">Chargement…</h1>
      <p class="hero-desc" id="heroDesc">Lecture des applications installées</p>
      <div class="hero-actions">
        <span class="btn-open">
          <svg class="btn-open-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.6v10.8c0 .5.5.8.9.5l8.4-5.4a.6.6 0 0 0 0-1L5.4 2.1c-.4-.3-.9 0-.9.5z" fill="#050608"/></svg>
          <span class="btn-open-label">Ouvrir</span>
        </span>
        <span class="hero-hint" id="heroHint">Appui long OK • Épingler / Retirer</span>
      </div>
    </div>
  </section>

  <section class="row row-dock" id="rowDock">
    <h2 class="row-title">Favoris</h2>
    <div class="track row-track" id="trackDock"></div>
  </section>

  <section class="row row-apps" id="rowApps">
    <h2 class="row-title">Toutes les applications<span class="row-count" id="countApps"></span></h2>
    <div class="track row-track" id="trackApps"></div>
  </section>

  <div class="toast" id="toast" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
